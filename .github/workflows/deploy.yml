name: Deploy to GitHub Pages

# Simplified: no lint or validation gates. On every push to main (or manual run) the site is
# installed, built and published to the gh-pages branch. The original gated workflow is in
# validate.yml, which is no longer called from here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the sitemap plugin can stamp each page's <lastmod>.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # d2 renders the diagrams at build time; the build fails without it.
      # Downloaded straight from the GitHub release, with retries, so a temporary network
      # error does not fail the publish.
      - name: Install d2 CLI
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/d2.tar.gz" \
            https://github.com/terrastruct/d2/releases/download/v0.7.1/d2-v0.7.1-linux-amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/d2.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/d2-v0.7.1/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/d2-v0.7.1/bin/d2" --version
      - name: Build Docusaurus site
        run: npm run build
        env:
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST }}
          POSTHOG_UI_HOST: ${{ vars.POSTHOG_UI_HOST }}
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          user_name: AA5123
          user_email: AA5123@users.noreply.github.com
          force_orphan: true